<body>
    <header>
        <h1>Kantin SANASE</h1>
        <p>Enak, Murah, dan Mengenyangkan!</p>
    </header>

<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container-fluid container p-0 position-relative">
    <a class="navbar-brand text-light fw-bold d-lg-none text-center w-100 me-0" href="index.html">Kantin SANASE</a>
    <button class="navbar-toggler bg-light position-absolute end-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
        <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
          <div class="navbar-nav gap-2 text-center w-100 justify-content-center my-2 my-lg-0">
            <a class="nav-btn" href="makanan.html">Makanan & Snack</a>

    <div class="container">
        <div class="info-section">
            <h2>🛒 Keranjang Pesanan Kamu</h2>
            <div id="daftar-pesanan">
                <p>Keranjang pesananmu masih kosong. Yuk, pilih menu jajanan dulu!</p>
            </div>
            <h3 style="text-align: right; color: var(--primary-color);">Total: <span id="total-harga">Rp 0</span></h3>
            <hr style="border: 1px solid var(--primary-color); margin: 30px 0;">

            <h2>Detail Pemesan (Mahasiswa)</h2>
            <form>
                <div class="form-group">
                    <label for="nama-pembeli">Nama Lengkap:</label>
                    <input type="text" id="nama-pembeli" placeholder="Masukkan nama kamu" required>
                </div>
                <div class="form-group">
                    <label for="prodi">Jurusan / Prodi:</label>
                    <input type="text" id="prodi" placeholder="Contoh: Teknik Metalurgi" required>
                </div>
                <button type="submit" class="submit-btn" style="width: 100%; font-size: 1.2rem;">Kirim Pesanan via WhatsApp</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
